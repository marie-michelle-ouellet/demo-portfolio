<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Marie-Michelle Ouellet</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Source+Sans+3:wght@400;600;700&display=swap">
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/bases.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components/project-card.css">
    <link rel="stylesheet" href="./css/components/modale.css">
    <link rel="stylesheet" href="./css/components/navbar.css">
</head>
<body>
    <!-- 
    Carte de projet tel que sélectionnée dans Figma for VS Code. Cette carte contient (en ordre) :
    - numéro de projet (commençant par 01)
    - image du projet (vignette), 
    - titre, 
    - catégorie (à gauche) et année (à droite), 
    - tags de compétences (logiciels). 
    -->
    <div class="project-card">
        <div class="project-card__number">01</div>
        <img src="./images/portfolio-01.jpg" alt="Vignette du projet 01" class="project-card__image">
        <h2 class="project-card__title">Titre du projet</h2>
        <div class="project-card__info">
            <span class="project-card__category">Catégorie</span>
            <span class="project-card__year">2026</span>
        </div>
        <div class="project-card__tags">
            <span class="project-card__tag">Logiciel 1</span>
            <span class="project-card__tag">Logiciel 2</span>
            <span class="project-card__tag">Logiciel 3</span>
        </div>
    </div>

</body>
</html>
